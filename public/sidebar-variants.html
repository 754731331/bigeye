<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>侧栏分类 · 方案对比</title>
<style>
:root{
  --bg:#0a0a0a; --surface:#0a0a0a; --surface2:#161616; --surface3:#202020;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.14);
  --hover:rgba(255,255,255,.06);
  --text:#eef1f7; --tdim:#8992a8;
  --accent:#2fe0c6; --accent2:#12b3a8; --accent-rgb:47,224,198;
  --radius-sm:9px; --radius-md:14px; --radius-lg:20px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#050505;color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:28px 20px 60px}
h1{font-size:19px;font-weight:700;margin:0 0 6px}
.sub{color:var(--tdim);font-size:12.5px;margin-bottom:26px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.col{width:292px;flex-shrink:0}
.cap{font-size:12.5px;color:var(--tdim);margin:0 0 8px 2px;line-height:1.45}
.cap b{color:var(--accent);font-weight:600}
.cap .no{color:#f2b84b}

/* ===== 侧栏外壳：完全照搬真实配色 ===== */
.sb{width:292px;height:560px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.3)}
.sb-head{min-height:45px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.sb-search{flex:1;height:32px;border-radius:var(--radius-sm);background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:7px;
  color:var(--tdim);font-size:12.5px}
.sb-body{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.sb-body::-webkit-scrollbar{width:6px}
.sb-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* 任务卡片（真实 .topic-item 观感） */
.card{background:var(--surface2);border:1px solid transparent;border-radius:var(--radius-md);
  padding:9px 12px;cursor:pointer;position:relative;transition:all .16s}
.card:hover{background:#1c1c1c;border-color:var(--border)}
.card.active{background:rgba(var(--accent-rgb),.10);border-color:rgba(var(--accent-rgb),.22)}
.card.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.card .t-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--text)}
.card.active .t-title{color:var(--accent)}
.card .t-meta{font-size:11px;color:var(--tdim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--tdim)}

/* ── 方案A：面包屑下钻 ── */
.crumb{display:flex;align-items:center;gap:4px;padding:6px 4px 9px;font-size:12px;
  white-space:nowrap;overflow-x:auto;flex-shrink:0}
.crumb::-webkit-scrollbar{display:none}
.crumb span{cursor:pointer;padding:2px 6px;border-radius:6px;color:var(--tdim)}
.crumb span:hover{background:var(--hover);color:var(--text)}
.crumb span.cur{color:var(--accent);font-weight:600}
.crumb i{color:#3a3f4d;font-style:normal}
.up{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--tdim);font-size:12.5px}
.up:hover{background:var(--hover);color:var(--text)}
.count{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.06);
  padding:1px 6px;border-radius:8px;color:var(--tdim)}
.folder{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--radius-sm);
  cursor:pointer;background:var(--surface2);border:1px solid transparent}
.folder:hover{background:#1c1c1c;border-color:var(--border)}
.folder .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;
  background:rgba(var(--accent-rgb),.13);color:var(--accent);font-size:11px;font-weight:700}
.folder .nm{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .chev{color:#3a3f4d;font-size:11px}

/* ── 方案B：分组卡片平铺 ── */
.grp{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;
  background:rgba(255,255,255,.012);margin-bottom:7px}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  background:rgba(255,255,255,.028);user-select:none}
.grp-h:hover{background:rgba(255,255,255,.05)}
.grp-h .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;
  box-shadow:0 0 8px rgba(var(--accent-rgb),.6)}
.grp-h .gn{font-size:12px;font-weight:700;letter-spacing:.4px;color:#c9d2e2;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-h .chev{color:#3a3f4d;font-size:10px;transition:transform .22s}
.grp.closed .grp-h .chev{transform:rotate(-90deg)}
.grp.closed .grp-b{display:none}
.grp-b{padding:4px 7px 7px;display:flex;flex-direction:column;gap:3px}
.grp-b .card{background:transparent;border-color:transparent;padding:7px 8px}
.grp-b .card:hover{background:var(--hover);border-color:transparent}
.grp-b .card.active{background:rgba(var(--accent-rgb),.10);border-color:rgba(var(--accent-rgb),.22)}

/* ── 方案C：免引线轻缩进（色条+圆点） ── */
.tree{display:flex;flex-direction:column;gap:1px;position:relative}
.nd{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);
  cursor:pointer;position:relative;transition:background .14s}
.nd:hover{background:var(--hover)}
.nd .tw{width:13px;flex-shrink:0;color:#5b6478;font-size:9px;text-align:center;
  transition:transform .2s;margin-left:calc(var(--d)*13px)}
.nd.closed .tw{transform:rotate(-90deg)}
.nd .bar{position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;
  margin-left:calc(3px + var(--d)*13px);background:var(--accent);opacity:var(--o,1)}
.nd .leafdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:#4a5261;
  margin-left:calc(4px + var(--d)*13px + var(--x,0px))}
.nd .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.nd .nm.f{font-weight:600}
.nd.lv0{background:rgba(255,255,255,.028)}
.nd.lv1 .nm{color:#dbe2ef}
.nd.lv2 .nm{color:#b6c0d2}
.nd.lv3 .nm{color:#98a3b8}
.nd.sel{background:rgba(var(--accent-rgb),.10)}
.nd.sel .nm{color:var(--accent)}
.nd .cnt{margin-left:auto;font-size:10.5px;color:#5b6478;flex-shrink:0}
.nd.hid{display:none}
.legend{display:flex;gap:14px;margin-top:14px;font-size:11.5px;color:var(--tdim);flex-wrap:wrap}
.legend b{color:#c9d2e2;font-weight:600}
.pick{margin-top:10px;font-size:12px;color:var(--tdim);background:rgba(var(--accent-rgb),.06);
  border:1px dashed rgba(var(--accent-rgb),.3);border-radius:10px;padding:9px 11px;line-height:1.6}
.pick b{color:var(--accent)}
</style></head><body>

<h1>侧栏分类 · 三个方案效果图</h1>
<div class="sub">真实配色 / 真实宽度 292px ｜ 都可以点：折起来、点进去试试，重点看"嵌到第 4 层还占不占宽度"</div>

<div class="row">

<!-- ============ A ============ -->
<div class="col">
  <div class="cap"><b>A · 面包屑下钻</b><br>一次只画一层，顶上一行面包屑。深度再深宽度不变。</div>
  <div class="sb">
    <div class="sb-head"><div class="sb-search">🔍 搜索任务…</div></div>
    <div class="sb-body" id="sbA">
      <div class="crumb" id="crumbA"></div>
      <div id="listA" style="display:flex;flex-direction:column;gap:3px"></div>
    </div>
  </div>
</div>

<!-- ============ B ============ -->
<div class="col">
  <div class="cap"><b>B · 分组卡片平铺</b><br>同级全左对齐，层级靠标题行+底色区分。总览感最好。</div>
  <div class="sb">
    <div class="sb-head"><div class="sb-search">🔍 搜索任务…</div></div>
    <div class="sb-body" id="sbB"></div>
  </div>
</div>

<!-- ============ C ============ -->
<div class="col">
  <div class="cap"><b>C · 免引线轻缩进</b><br><span class="no">保留树</span>，但删掉横线，只用细色条+圆点，缩进量砍半。</div>
  <div class="sb">
    <div class="sb-head"><div class="sb-search">🔍 搜索任务…</div></div>
    <div class="sb-body" id="sbC"></div>
  </div>
</div>

</div>

<div class="legend">
  <span><b>对比要点</b></span>
  <span>① 4 层时的横向占位</span>
  <span>② 一眼能看出几个分组</span>
  <span>③ 找一个旧任务的点击数</span>
</div>

<script>
/* ================= 数据 ================= */
const DATA = {
  name:'全部任务',
  children:[
    { n:'大眼开发', i:'大', c:[
        { n:'前端重构', c:[
            { n:'侧栏分类设计', c:[
                {n:'方案对比页'},{n:'真实配色还原'},{n:'深度测试 4 层'}]},
            { n:'消息去重', c:[{n:'时钟偏差排查'},{n:'dedupeMsgs 修'}]}
        ]},
        { n:'记忆链路', c:[{n:'召回优先级'},{n:'碎片挂错任务'}]},
        { n:'工具书维护', c:[{n:'规则引擎保洁'}]}
    ]},
    { n:'进销存软件', i:'进', c:[
        { n:'草稿-审核两段式', c:[{n:'幂等红冲'}]},
        { n:'参考金蝶改造', c:[{n:'页面切换异常'}]}
    ]},
    { n:'论文与调研', i:'研', c:[
        { n:'视频溯源核验', c:[{n:'原始论文比对'}]},
        { n:'开源仓库评估', c:[{n:'README 宣称核验'}]}
    ]},
    { n:'零散问答', i:'杂', c:[] }
  ]
};

/* ================= A：面包屑下钻 ================= */
(function(){
  const stack=[DATA];
  const crumb=document.getElementById('crumbA'), list=document.getElementById('listA');
  function draw(){
    crumb.innerHTML = stack.map((n,k)=> k<stack.length-1
      ? `<span onclick="A.go(${k})">${n.name}</span><i>›</i>`
      : `<span class="cur">${n.name}</span>`).join('');
    const cur=stack[stack.length-1];
    const kids=cur.children||[];
    let h='';
    if(stack.length>1) h+=`<div class="up" onclick="A.up()">↩ 返回上一层</div>`;
    h+= kids.filter(k=>k.c&&k.c.length).map(k=>`
      <div class="folder" onclick="A.into('${k.n}')">
        <div class="ico">${k.i||'▣'}</div>
        <div class="nm">${k.n}</div>
        <div class="count">${k.c.length}</div><div class="chev">›</div>
      </div>`).join('');
    h+= kids.filter(k=>!k.c||!k.c.length).map(k=>`
      <div class="card"><div class="t-title">${k.n}</div>
      <div class="t-meta">刚刚 · ¥0.12</div></div>`).join('');
    list.innerHTML=h||'<div class="dim" style="padding:14px;font-size:12px">（空）</div>';
  }
  window.A={ go:k=>{stack.length=k+1;draw()}, up:()=>{stack.pop();draw()},
    into:n=>{const c=stack[stack.length-1].children.find(x=>x.n===n); if(c){stack.push({name:n,children:c.c});draw()}} };
  draw();
})();

/* ================= B：分组卡片平铺 ================= */
(function(){
  const box=document.getElementById('sbB');
  function card(x,active){return `<div class="card${active?' active':''}">
    <div class="t-title">${x.n}</div>
    <div class="t-meta">${x.m||'2 小时前 · ¥0.08'}</div></div>`}
  box.innerHTML = DATA.children.map((g,gi)=>{
    const leaves = g.c.flatMap(s=> s.c&&s.c.length ? s.c.map(l=>({n:s.n+' / '+l.n})) : [{n:s.n}]);
    return `<div class="grp">
      <div class="grp-h" onclick="this.parentNode.classList.toggle('closed')">
        <div class="dot"></div><div class="gn">${g.n}</div>
        <div class="count">${leaves.length}</div><div class="chev">▾</div>
      </div>
      <div class="grp-b">${leaves.slice(0,4).map((l,i)=>card(l, gi===0&&i===0)).join('')}
      ${leaves.length>4?`<div class="dim" style="font-size:11.5px;padding:5px 8px">还有 ${leaves.length-4} 个…</div>`:''}
      </div></div>`;
  }).join('');
})();

/* ================= C：免引线轻缩进 ================= */
(function(){
  const box=document.getElementById('sbC');
  let id=0;
  function walk(node,depth,parentId){
    const myId='n'+(id++);
    const kids=node.c||[];
    const has=kids.length>0;
    let h=`<div class="nd lv${Math.min(depth,3)}" data-p="${parentId||''}" data-id="${myId}" data-depth="${depth}"
      style="--d:${depth}" onclick="C.toggle('${myId}',${has})">
      <div class="bar" style="--o:${1-depth*0.22}"></div>
      ${has?`<div class="tw">▾</div><div class="nm f">${node.n}</div><div class="cnt">${kids.length}</div>`
            :`<div class="leafdot"></div><div class="nm">${node.n}</div><div class="cnt">·</div>`}
    </div>`;
    kids.forEach(k=> h+=walk(k,depth+1,has?myId:parentId));
    return h;
  }
  box.innerHTML = DATA.children.map(g=> walk(g,0,null)).join('');
  // 可见性全量重算：DFS 顺序下，depth=d 的节点其祖先必是最近的 depth 0..d-1
  function refresh(){
    const stack=[];
    for(const el of box.children){
      const d=parseInt(el.dataset.depth,10);
      stack.length=d;
      el.classList.toggle('hid', stack.some(a=>a.classList.contains('closed')));
      stack.push(el);
    }
  }
  window.C={ toggle(mid,has){
    if(!has) return;
    const el=box.querySelector(`[data-id="${mid}"]`);
    el.classList.toggle('closed');
    refresh();
  }}, window.C.refresh=refresh;
})();
</script>
</body></html>
