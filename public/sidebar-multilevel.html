<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>侧栏多层嵌套 · 免缩进方案</title>
<style>
:root{
  --bg:#0a0a0a; --surface2:#161616; --surface3:#202020;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.14);
  --hover:rgba(255,255,255,.06);
  --text:#eef1f7; --tdim:#8992a8;
  --accent:#2fe0c6; --accent-rgb:47,224,198;
  --radius-sm:9px; --radius-md:14px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#050505;color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:28px 20px 60px;}
h1{font-size:19px;margin:0 0 6px}
.sub{color:var(--tdim);font-size:13px;margin-bottom:26px}
.stage{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}

/* ---- 侧栏外壳 ---- */
.sidebar{width:292px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;
  max-height:560px}
.sb-head{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
.sb-title{font-size:12px;color:var(--tdim);letter-spacing:.06em;text-transform:uppercase}

/* ---- 面包屑 ---- */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;
  padding:9px 10px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);font-size:12px;min-height:38px}
.crumb{color:var(--tdim);padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;
  transition:.15s}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb.cur{color:var(--accent);font-weight:600;background:rgba(var(--accent-rgb),.08)}
.sep{color:#3a4050;font-size:11px}

/* ---- 列表区 ---- */
.scroll{overflow-y:auto;padding:8px 8px 14px;flex:1}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}

.row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--radius-sm);
  cursor:pointer;transition:.13s;position:relative}
.row:hover{background:var(--hover)}
.row.on{background:rgba(var(--accent-rgb),.09)}
.ico{width:15px;height:15px;flex:none;opacity:.75;display:grid;place-items:center}
.fold{width:14px;height:14px;flex:none;color:#5d6577;display:grid;place-items:center;
  transition:transform .18s;font-size:9px}
.row:hover .fold{color:var(--tdim)}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.count{font-size:11px;color:#5d6577;flex:none}
.chev{color:#4a5265;font-size:10px;flex:none;transition:.15s}
.row:hover .chev{color:var(--accent);transform:translateX(2px)}

/* ---- 分节小标题（二级的表达方式）---- */
.sect{margin:12px 2px 4px;padding-left:9px;position:relative;
  font-size:11px;color:#7c86a0;letter-spacing:.05em;font-weight:600;
  display:flex;align-items:center;gap:7px;text-transform:uppercase}
.sect::before{content:'';position:absolute;left:1px;top:2px;bottom:2px;width:2px;
  border-radius:2px;background:var(--accent2, rgba(var(--accent-rgb),.55))}
.sect .n{color:#464e60;font-weight:500;letter-spacing:0}
.sect-link{margin-left:auto;font-size:10px;color:#4a5265;opacity:0;transition:.15s;
  letter-spacing:0;cursor:pointer}
.sect:hover .sect-link{opacity:1}
.sect:first-child{margin-top:2px}

/* ---- 空态/提示 ---- */
.tip{margin-top:8px;font-size:12px;color:var(--tdim);line-height:1.7;max-width:292px}
.tip b{color:var(--accent)}
.ruler{position:absolute;top:0;bottom:0;width:1px;background:rgba(var(--accent-rgb),.25)}
</style></head><body>

<h1>多层嵌套 · 免缩进方案</h1>
<div class="sub">真实配色 / 真实宽度 292px ｜ 点任意带「›」的条目进去，点面包屑跳回任意层 —— 你下钻到第 6 层，看它宽度有没有变过</div>

<div class="stage">
  <div class="sidebar">
    <div class="sb-head"><div class="sb-title">任务</div></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="scroll" id="list"></div>
  </div>

  <div>
    <div class="tip" style="font-size:13px;color:#c9d2e2;max-width:330px">
      <b>它是怎么做到不占宽度的：</b><br>
      · 层级不再用缩进表达 → 全部条目左对齐，同一列起点<br>
      · 同层内部靠「分节小标题」（左侧 2px 青色条 + 小号灰字）切块<br>
      · 下钻靠面包屑，一次只画一层 → 深度增加，宽度恒定 292px<br>
      · 有下级的带「›」，叶子没有 → 一眼看出哪里能进去
    </div>
    <div class="tip" style="max-width:330px">
      下钻路径会实时显示在左边栏顶部，你可以一路点到第 6 层再逐级退回来。
    </div>
  </div>
</div>

<script>
const DATA = {
  id:'root', name:'全部任务', children:[
    {id:'a', name:'大眼开发', n:12, children:[
      {id:'a1', name:'前端重构', n:5, children:[
        {id:'a1a', name:'侧栏分类设计', n:3, children:[
          {id:'a1a1', name:'免缩进方案', n:2, children:[
            {id:'a1a1a', name:'面包屑下钻', n:6},
            {id:'a1a1b', name:'分组卡片平铺', n:4}
          ]},
          {id:'a1a2', name:'配色对齐', n:2}
        ]},
        {id:'a1b', name:'流式渲染', n:3},
        {id:'a1c', name:'资产面板', n:4}
      ]},
      {id:'a2', name:'记忆链路', n:7, children:[
        {id:'a2a', name:'晶体沉淀', n:3, children:[
          {id:'a2a1', name:'升层工作流', n:2},
          {id:'a2a2', name:'召回优先级', n:1}
        ]},
        {id:'a2b', name:'叙事感知', n:4}
      ]},
      {id:'a3', name:'任务DAG', n:5}
    ]},
    {id:'b', name:'进销存', n:8, children:[
      {id:'b1', name:'草稿审核两段式', n:4},
      {id:'b2', name:'库存幂等', n:4}
    ]},
    {id:'c', name:'调研', n:6, children:[
      {id:'c1', name:'产品能力取证', n:3},
      {id:'c2', name:'视频溯源', n:3}
    ]}
  ]
};

const path = [DATA];
const ICO_FOLDER = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ICO_DOC = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const ICO_TASK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>';

function render(){
  // 面包屑
  const c = document.getElementById('crumbs');
  c.innerHTML = path.map((n,i)=>{
    const last = i === path.length-1;
    return `<span class="crumb ${last?'cur':''}" data-i="${i}">${last?'':''}${n.name}</span>` +
           (last?'':'<span class="sep">›</span>');
  }).join('');

  // 列表
  const cur = path[path.length-1];
  const L = document.getElementById('list');
  if(!cur.children || !cur.children.length){
    L.innerHTML = '<div style="padding:22px 10px;text-align:center;color:#5d6577;font-size:12.5px">这一层没有下级了</div>';
    return;
  }
  // 分节：把子项按"有无下级"切成两块（这里演示分节标题的用法）
  const groups = [
    {t:'进行中', items: cur.children.filter(x=>x.children)},
    {t:'单条记录', items: cur.children.filter(x=>!x.children)}
  ].filter(g=>g.items.length);

  L.innerHTML = groups.map(g=>`
    <div class="sect"><span>${g.t}</span><span class="n">${g.items.length}</span>
      <span class="sect-link">折叠</span></div>
    ${g.items.map(n=>`
      <div class="row" data-id="${n.id}">
        <span class="fold">${n.children?'▾':''}</span>
        <span class="ico">${n.children?ICO_FOLDER:ICO_TASK}</span>
        <span class="name">${n.name}</span>
        <span class="count">${n.n||''}</span>
        ${n.children?'<span class="chev">›</span>':''}
      </div>`).join('')}
  `).join('');

  L.querySelectorAll('.row').forEach(r=>{
    r.onclick = ()=>{
      const node = find(DATA, r.dataset.id);
      if(node && node.children){ path.push(node); render(); }
      else { r.classList.toggle('on'); }
    };
  });
  c.querySelectorAll('.crumb').forEach(e=>{
    e.onclick = ()=>{ path.length = (+e.dataset.i)+1; render(); };
  });
}
function find(node,id){
  if(node.id===id) return node;
  for(const ch of (node.children||[])){ const r=find(ch,id); if(r) return r; }
  return null;
}
render();
</script>
</body></html>
